<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주차의 신</title>
<style>
  :root {
    --bg: #101214;
    --panel: #1b1e22;
    --border: #33383e;
    --text: #eef1f4;
    --muted: #9aa3ad;
    --accent: #ffcc33;
    --good: #4ade80;
    --bad: #ff5d5d;
    --asphalt: #2b2f34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1c2024, #0a0b0d 75%);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--accent);
    text-align: center;
    text-shadow: 0 0 12px rgba(255,204,51,0.35);
  }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 3px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 30px rgba(255, 204, 51, 0.08);
  }
  canvas#field {
    display: block;
    background: var(--asphalt);
    border-radius: 4px;
  }
  .side {
    width: 240px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 13px;
    margin: 0 0 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .stat-row span:last-child {
    font-weight: bold;
    color: #fff;
  }
  #timeLeft.warn { color: var(--bad) !important; }
  .level-select {
    display: flex;
    gap: 6px;
  }
  .level-btn {
    flex: 1;
    padding: 8px 0;
    background: #26292e;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.15s, transform 0.1s;
  }
  .level-btn:hover:not(:disabled) { background: #35393f; }
  .level-btn.active {
    background: var(--accent);
    color: #10101c;
    border-color: transparent;
  }
  .level-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .vehicle-name {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
    line-height: 1.6;
  }
  .controls-list {
    font-size: 12.5px;
    line-height: 1.9;
    color: #c7ccd1;
  }
  .controls-list b { color: #fff; }
  button.action {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #10101c;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  button.action:hover { filter: brightness(1.1); }
  button.action.secondary {
    background: #3a3f45;
    color: var(--text);
  }
  .overlay {
    position: absolute;
    inset: 10px;
    background: rgba(8, 9, 10, 0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    text-align: center;
    gap: 10px;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay .title {
    font-size: 28px;
    font-weight: bold;
    color: var(--accent);
  }
  .overlay .title.good { color: var(--good); }
  .overlay .title.bad { color: var(--bad); }
  .overlay .sub { font-size: 14px; color: #ccc; }
  .overlay .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .overlay .btn-row button {
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>주차의 신 - PARKING MASTER</h1>
    <div class="board-wrap">
      <canvas id="field" width="800" height="500"></canvas>
      <div class="overlay" id="overlay">
        <div class="title" id="overlayTitle">준비</div>
        <div class="sub" id="overlaySub"></div>
        <div class="btn-row" id="overlayBtns"></div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>Status</h2>
      <div class="stat-row"><span>레벨</span><span id="levelLabel">1</span></div>
      <div class="stat-row"><span>차량</span><span id="vehicleLabel">승용차</span></div>
      <div class="stat-row"><span>남은 시간</span><span id="timeLeft">60</span></div>
      <div class="stat-row"><span>점수</span><span id="score">0</span></div>
    </div>

    <div class="panel">
      <h2>레벨 선택 (난이도)</h2>
      <div class="level-select" id="levelSelect">
        <button class="level-btn active" data-level="1">1</button>
        <button class="level-btn" data-level="2" disabled>2</button>
        <button class="level-btn" data-level="3" disabled>3</button>
        <button class="level-btn" data-level="4" disabled>4</button>
        <button class="level-btn" data-level="5" disabled>5</button>
      </div>
      <div class="vehicle-name" id="levelInfo">1. 승용차 · 60초</div>
    </div>

    <div class="panel">
      <h2>조작법</h2>
      <div class="controls-list">
        <b>↑</b> 전진<br>
        <b>↓</b> 후진<br>
        <b>← →</b> 조향(회전)<br>
        <b>P</b> 일시정지<br>
        <b>R</b> 이 판 다시하기
      </div>
      <button class="action secondary" id="pauseBtn">일시정지</button>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 800, H = 500;
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');

  const levelLabelEl = document.getElementById('levelLabel');
  const vehicleLabelEl = document.getElementById('vehicleLabel');
  const timeLeftEl = document.getElementById('timeLeft');
  const scoreEl = document.getElementById('score');
  const levelInfoEl = document.getElementById('levelInfo');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtns = document.getElementById('overlayBtns');
  const pauseBtn = document.getElementById('pauseBtn');
  const levelSelect = document.getElementById('levelSelect');

  // ---------- Vehicle definitions: easiest -> hardest ----------
  // length/width in px, wheelbase governs turning radius (bigger = clumsier turn).
  const VEHICLES = [
    { key: 'car',   label: '승용차',   length: 38, width: 18, wheelbase: 26, maxSpeed: 210, maxReverse: 130, accel: 230, brake: 320, friction: 110, maxSteer: 0.62, steerSpeed: 3.2, color: '#5dd6ff', cab: '#bff2ff', time: 60 },
    { key: 'suv',   label: 'SUV',      length: 46, width: 21, wheelbase: 31, maxSpeed: 195, maxReverse: 115, accel: 200, brake: 300, friction: 100, maxSteer: 0.56, steerSpeed: 2.8, color: '#7dffb0', cab: '#d4ffe6', time: 55 },
    { key: 'truck', label: '트럭',     length: 62, width: 25, wheelbase: 40, maxSpeed: 165, maxReverse: 95,  accel: 170, brake: 260, friction: 90,  maxSteer: 0.50, steerSpeed: 2.3, color: '#ffcf5d', cab: '#3a3f45', time: 48 },
    { key: 'bus',   label: '버스',     length: 82, width: 27, wheelbase: 56, maxSpeed: 140, maxReverse: 80,  accel: 140, brake: 220, friction: 78,  maxSteer: 0.42, steerSpeed: 1.9, color: '#ff9d5d', cab: '#fff3e6', time: 42 },
    { key: 'tank',  label: '탱크',     length: 66, width: 33, wheelbase: 0,  maxSpeed: 120, maxReverse: 90,  accel: 190, brake: 280, friction: 95,  isTank: true, pivotRate: 1.7, color: '#8a8f5d', cab: '#5c603a', time: 38 },
  ];
  const LEVEL_COUNT = VEHICLES.length;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function normAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  // ---------- Geometry helpers (rotated rectangles via SAT) ----------
  function rectCorners(cx, cy, angle, length, width) {
    const hl = length / 2, hw = width / 2;
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const local = [[hl, hw], [hl, -hw], [-hl, -hw], [-hl, hw]];
    return local.map(([lx, ly]) => [cx + lx * cos - ly * sin, cy + lx * sin + ly * cos]);
  }

  function projectAxis(corners, axis) {
    let min = Infinity, max = -Infinity;
    for (const [x, y] of corners) {
      const p = x * axis[0] + y * axis[1];
      if (p < min) min = p;
      if (p > max) max = p;
    }
    return [min, max];
  }

  function polygonsOverlap(cornersA, cornersB) {
    const polys = [cornersA, cornersB];
    for (const poly of polys) {
      for (let i = 0; i < poly.length; i++) {
        const [x1, y1] = poly[i];
        const [x2, y2] = poly[(i + 1) % poly.length];
        const edge = [x2 - x1, y2 - y1];
        const axis = [-edge[1], edge[0]];
        const len = Math.hypot(axis[0], axis[1]) || 1;
        axis[0] /= len; axis[1] /= len;
        const [minA, maxA] = projectAxis(cornersA, axis);
        const [minB, maxB] = projectAxis(cornersB, axis);
        if (maxA < minB || maxB < minA) return false;
      }
    }
    return true;
  }

  function insideSpot(corners, spot, margin) {
    const cos = Math.cos(-spot.angle), sin = Math.sin(-spot.angle);
    const hl = spot.length / 2 - margin, hw = spot.width / 2 - margin;
    for (const [x, y] of corners) {
      const dx = x - spot.x, dy = y - spot.y;
      const lx = dx * cos - dy * sin;
      const ly = dx * sin + dy * cos;
      if (lx < -hl || lx > hl || ly < -hw || ly > hw) return false;
    }
    return true;
  }

  // ---------- Level layout generation ----------
  // Odd levels: perpendicular "garage" spot flanked left/right.
  // Even levels: parallel-parking spot flanked front/back near the right curb.
  function buildLevel(levelIdx) {
    const cfg = VEHICLES[levelIdx];
    const obstacles = [];
    let spot;
    const startX = 400, startY = H - 45;
    const startAngle = -Math.PI / 2;

    const garageFactors = [2.3, 1.7, 1.4]; // level 1,3,5 (index 0,2,4)
    const parallelFactors = [1.65, 1.35];  // level 2,4 (index 1,3)

    if (levelIdx % 2 === 0) {
      // perpendicular garage-style spot near top center
      const gi = levelIdx / 2;
      const spotWidth = cfg.width * garageFactors[gi];
      const spotLength = cfg.length * 1.35;
      const sx = 400, sy = 105;
      spot = { x: sx, y: sy, angle: -Math.PI / 2, length: spotLength, width: spotWidth };
      const flankGap = spotWidth / 2 + cfg.width / 2 + 4;
      obstacles.push({ x: sx - flankGap, y: sy, angle: -Math.PI / 2, length: cfg.length, width: cfg.width, type: 'car' });
      obstacles.push({ x: sx + flankGap, y: sy, angle: -Math.PI / 2, length: cfg.length, width: cfg.width, type: 'car' });
      if (levelIdx >= 4) {
        // extra maze obstacles for the tank level to force pivot maneuvers
        obstacles.push({ x: 250, y: 300, angle: 0.4, length: cfg.length * 0.9, width: cfg.width * 0.9, type: 'barrier' });
        obstacles.push({ x: 560, y: 320, angle: -0.5, length: cfg.length * 0.9, width: cfg.width * 0.9, type: 'barrier' });
        obstacles.push({ x: 400, y: 230, angle: 0, length: cfg.width * 1.6, width: cfg.width * 0.9, type: 'barrier' });
      }
    } else {
      // parallel-parking spot along the right side
      const pi = (levelIdx - 1) / 2;
      const spotLength = cfg.length * parallelFactors[pi];
      const spotWidth = cfg.width * 1.5;
      const sx = 660, sy = 250;
      spot = { x: sx, y: sy, angle: -Math.PI / 2, length: spotLength, width: spotWidth };
      const flankGap = spotLength / 2 + cfg.length / 2 + 4;
      obstacles.push({ x: sx, y: sy - flankGap, angle: -Math.PI / 2, length: cfg.length, width: cfg.width, type: 'car' });
      obstacles.push({ x: sx, y: sy + flankGap, angle: -Math.PI / 2, length: cfg.length, width: cfg.width, type: 'car' });
      if (levelIdx >= 3) {
        // path-blocking obstacle forces an S-curve approach
        obstacles.push({ x: 430, y: 300, angle: -Math.PI / 2, length: cfg.length * 0.9, width: cfg.width, type: 'car' });
      }
    }

    return {
      cfg, spot, obstacles,
      startX, startY, startAngle,
      timeLimit: cfg.time,
    };
  }

  // ---------- Game state ----------
  let unlockedLevel = 1;
  let curLevel = 1;
  let level = null;      // built layout
  let veh = null;        // live vehicle state
  let timeLeft = 0;
  let score = 0;
  let state = 'ready';   // ready | playing | crashed | timeout | success | paused
  let parkTimer = 0;
  let lastTime = 0;
  const keys = { up: false, down: false, left: false, right: false };

  function newVehicleState() {
    return {
      x: level.startX, y: level.startY, angle: level.startAngle,
      speed: 0, steerAngle: 0,
    };
  }

  function loadLevel(n) {
    curLevel = n;
    level = buildLevel(n - 1);
    veh = newVehicleState();
    timeLeft = level.timeLimit;
    parkTimer = 0;
    state = 'ready';
    levelLabelEl.textContent = n;
    vehicleLabelEl.textContent = level.cfg.label;
    timeLeftEl.textContent = Math.ceil(timeLeft);
    timeLeftEl.classList.remove('warn');
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.level) === n);
    });
    levelInfoEl.textContent = `${n}. ${level.cfg.label} · ${level.cfg.time}초`;
    showOverlay('준비', `${level.cfg.label} 주차 - 아무 방향키나 눌러 시작`, [
      { text: '시작', cls: '', onClick: startPlaying },
    ]);
  }

  function startPlaying() {
    hideOverlay();
    state = 'playing';
  }

  function showOverlay(title, sub, buttons, cls) {
    overlay.classList.add('show');
    overlayTitle.textContent = title;
    overlayTitle.className = 'title' + (cls ? ' ' + cls : '');
    overlaySub.textContent = sub;
    overlayBtns.innerHTML = '';
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.textContent = b.text;
      btn.style.background = b.cls === 'good' ? 'var(--good)' : (b.cls === 'bad' ? 'var(--bad)' : 'var(--accent)');
      btn.style.color = '#10101c';
      btn.addEventListener('click', b.onClick);
      overlayBtns.appendChild(btn);
    }
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function retryLevel() {
    loadLevel(curLevel);
  }

  function onCrash() {
    state = 'crashed';
    showOverlay('충돌!', '다른 차량이나 벽에 부딪혔습니다.', [
      { text: '다시 시도', onClick: retryLevel },
    ], 'bad');
  }

  function onTimeout() {
    state = 'timeout';
    showOverlay('시간 초과!', '제한 시간 안에 주차하지 못했습니다.', [
      { text: '다시 시도', onClick: retryLevel },
    ], 'bad');
  }

  function onSuccess() {
    state = 'success';
    const gained = curLevel * 100 + Math.ceil(timeLeft) * 5;
    score += gained;
    scoreEl.textContent = score;
    if (curLevel < LEVEL_COUNT && curLevel + 1 > unlockedLevel) {
      unlockedLevel = curLevel + 1;
      const nextBtn = document.querySelector(`.level-btn[data-level="${unlockedLevel}"]`);
      if (nextBtn) nextBtn.disabled = false;
    }
    const buttons = [{ text: '다시하기', onClick: retryLevel }];
    if (curLevel < LEVEL_COUNT) {
      buttons.unshift({ text: '다음 레벨', cls: 'good', onClick: () => loadLevel(curLevel + 1) });
    }
    showOverlay(
      curLevel < LEVEL_COUNT ? '주차 성공!' : '모든 레벨 클리어!',
      `+${gained}점 (남은 시간 ${Math.ceil(timeLeft)}초)`,
      buttons,
      'good'
    );
  }

  // ---------- Physics update ----------
  function update(dt) {
    const cfg = level.cfg;

    let accelInput = 0;
    if (keys.up) accelInput = 1;
    else if (keys.down) accelInput = -1;

    if (accelInput !== 0) {
      const rate = (veh.speed * accelInput < 0) ? cfg.brake : cfg.accel;
      veh.speed += accelInput * rate * dt;
    } else {
      if (veh.speed > 0) veh.speed = Math.max(0, veh.speed - cfg.friction * dt);
      else if (veh.speed < 0) veh.speed = Math.min(0, veh.speed + cfg.friction * dt);
    }
    veh.speed = clamp(veh.speed, -cfg.maxReverse, cfg.maxSpeed);

    if (cfg.isTank) {
      let turnInput = 0;
      if (keys.left) turnInput = -1;
      else if (keys.right) turnInput = 1;
      veh.angle += turnInput * cfg.pivotRate * dt;
    } else {
      let steerInput = 0;
      if (keys.left) steerInput = -1;
      else if (keys.right) steerInput = 1;
      if (steerInput !== 0) {
        veh.steerAngle += steerInput * cfg.steerSpeed * dt;
      } else if (veh.steerAngle > 0) {
        veh.steerAngle = Math.max(0, veh.steerAngle - cfg.steerSpeed * 1.5 * dt);
      } else if (veh.steerAngle < 0) {
        veh.steerAngle = Math.min(0, veh.steerAngle + cfg.steerSpeed * 1.5 * dt);
      }
      veh.steerAngle = clamp(veh.steerAngle, -cfg.maxSteer, cfg.maxSteer);
      const omega = (veh.speed / cfg.wheelbase) * Math.tan(veh.steerAngle);
      veh.angle += omega * dt;
    }
    veh.angle = normAngle(veh.angle);
    veh.x += Math.cos(veh.angle) * veh.speed * dt;
    veh.y += Math.sin(veh.angle) * veh.speed * dt;

    const corners = rectCorners(veh.x, veh.y, veh.angle, cfg.length, cfg.width);

    // wall collision (canvas boundary)
    for (const [x, y] of corners) {
      if (x < 8 || x > W - 8 || y < 8 || y > H - 8) {
        onCrash();
        return;
      }
    }
    // obstacle collision
    for (const ob of level.obstacles) {
      const obCorners = rectCorners(ob.x, ob.y, ob.angle, ob.length, ob.width);
      if (polygonsOverlap(corners, obCorners)) {
        onCrash();
        return;
      }
    }

    // parking success check: fully inside spot, roughly aligned, nearly stopped
    const angleDiff = Math.min(
      Math.abs(normAngle(veh.angle - level.spot.angle)),
      Math.abs(normAngle(veh.angle - level.spot.angle - Math.PI))
    );
    const parked = insideSpot(corners, level.spot, 2) && angleDiff < 0.26 && Math.abs(veh.speed) < 10;
    if (parked) {
      parkTimer += dt;
      if (parkTimer > 0.5) {
        onSuccess();
        return;
      }
    } else {
      parkTimer = 0;
    }

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      timeLeftEl.textContent = 0;
      onTimeout();
      return;
    }
    timeLeftEl.textContent = Math.ceil(timeLeft);
    timeLeftEl.classList.toggle('warn', timeLeft < 10);
  }

  // ---------- Drawing ----------
  function drawSpot(spot) {
    ctx.save();
    ctx.translate(spot.x, spot.y);
    ctx.rotate(spot.angle);
    ctx.strokeStyle = 'var(--good)';
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.strokeRect(-spot.length / 2, -spot.width / 2, spot.length, spot.width);
    ctx.setLineDash([]);
    // arrow indicating parking direction
    ctx.fillStyle = 'rgba(74,222,128,0.6)';
    ctx.beginPath();
    ctx.moveTo(spot.length / 2 - 10, 0);
    ctx.lineTo(spot.length / 2 - 20, -7);
    ctx.lineTo(spot.length / 2 - 20, 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawObstacle(ob) {
    ctx.save();
    ctx.translate(ob.x, ob.y);
    ctx.rotate(ob.angle);
    if (ob.type === 'barrier') {
      ctx.fillStyle = '#444';
      ctx.fillRect(-ob.length / 2, -ob.width / 2, ob.length, ob.width);
      ctx.fillStyle = '#ffcc33';
      const stripes = 4;
      for (let i = 0; i < stripes; i++) {
        if (i % 2 === 0) continue;
        ctx.fillRect(-ob.length / 2 + (ob.length / stripes) * i, -ob.width / 2, ob.length / stripes, ob.width);
      }
    } else {
      ctx.fillStyle = '#5a6068';
      ctx.fillRect(-ob.length / 2, -ob.width / 2, ob.length, ob.width);
      ctx.fillStyle = '#8fa0ad';
      ctx.fillRect(-ob.length / 2 + ob.length * 0.15, -ob.width / 2 + 2, ob.length * 0.5, ob.width - 4);
    }
    ctx.restore();
  }

  function drawVehicle() {
    const cfg = level.cfg;
    ctx.save();
    ctx.translate(veh.x, veh.y);
    ctx.rotate(veh.angle);
    const L = cfg.length, Wd = cfg.width;

    if (cfg.key === 'tank') {
      // tracks
      ctx.fillStyle = '#1c1e1a';
      ctx.fillRect(-L / 2, -Wd / 2, L, 5);
      ctx.fillRect(-L / 2, Wd / 2 - 5, L, 5);
      // hull
      ctx.fillStyle = cfg.color;
      ctx.fillRect(-L / 2 + 3, -Wd / 2 + 5, L - 6, Wd - 10);
      // turret
      ctx.fillStyle = cfg.cab;
      ctx.beginPath();
      ctx.arc(-L * 0.05, 0, Wd * 0.32, 0, Math.PI * 2);
      ctx.fill();
      // barrel
      ctx.fillStyle = '#333';
      ctx.fillRect(0, -2, L * 0.55, 4);
    } else if (cfg.key === 'truck') {
      ctx.fillStyle = cfg.color;
      ctx.fillRect(-L / 2, -Wd / 2, L * 0.62, Wd);
      ctx.fillStyle = cfg.cab;
      ctx.fillRect(L / 2 - L * 0.34, -Wd / 2 + 2, L * 0.3, Wd - 4);
      ctx.fillStyle = '#dfeaff';
      ctx.fillRect(L / 2 - L * 0.12, -Wd / 2 + 4, L * 0.08, Wd - 8);
    } else if (cfg.key === 'bus') {
      ctx.fillStyle = cfg.color;
      ctx.fillRect(-L / 2, -Wd / 2, L, Wd);
      ctx.fillStyle = cfg.cab;
      ctx.fillRect(-L / 2 + 4, -Wd / 2 + 4, L - 8, 5);
      ctx.fillStyle = '#dfeaff';
      const winCount = 6;
      const winW = (L - 16) / winCount * 0.6;
      const gap = (L - 16) / winCount;
      for (let i = 0; i < winCount; i++) {
        ctx.fillRect(-L / 2 + 10 + i * gap, -Wd / 2 + 12, winW, Wd - 20);
      }
    } else {
      // car / suv
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-L / 2, -Wd / 2, L, Wd, 4) : ctx.rect(-L / 2, -Wd / 2, L, Wd);
      ctx.fill();
      ctx.fillStyle = cfg.cab;
      ctx.fillRect(-L * 0.08, -Wd / 2 + 3, L * 0.4, Wd - 6);
    }
    // front indicator (headlights) so heading direction is always clear
    ctx.fillStyle = '#fff9c4';
    ctx.fillRect(L / 2 - 3, -Wd / 2 + 1, 3, 3);
    ctx.fillRect(L / 2 - 3, Wd / 2 - 4, 3, 3);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // asphalt lane markings
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let x = 40; x < W; x += 80) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    // boundary wall
    ctx.strokeStyle = '#ffcc33';
    ctx.lineWidth = 3;
    ctx.strokeRect(8, 8, W - 16, H - 16);

    if (level) {
      drawSpot(level.spot);
      for (const ob of level.obstacles) drawObstacle(ob);
      drawVehicle();
    }
  }

  // ---------- Main loop ----------
  function loop(time) {
    if (!lastTime) lastTime = time;
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    dt = Math.min(dt, 0.05);

    if (state === 'playing') {
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  document.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'ArrowUp': e.preventDefault(); keys.up = true; break;
      case 'ArrowDown': e.preventDefault(); keys.down = true; break;
      case 'ArrowLeft': e.preventDefault(); keys.left = true; break;
      case 'ArrowRight': e.preventDefault(); keys.right = true; break;
      case 'KeyP': e.preventDefault(); togglePause(); break;
      case 'KeyR': e.preventDefault(); if (state !== 'ready') retryLevel(); break;
      default: return;
    }
    if (state === 'ready' && (keys.up || keys.down || keys.left || keys.right)) {
      startPlaying();
    }
  });
  document.addEventListener('keyup', (e) => {
    switch (e.code) {
      case 'ArrowUp': keys.up = false; break;
      case 'ArrowDown': keys.down = false; break;
      case 'ArrowLeft': keys.left = false; break;
      case 'ArrowRight': keys.right = false; break;
    }
  });

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('일시정지', '', [{ text: '계속하기', onClick: () => { hideOverlay(); state = 'playing'; } }]);
      pauseBtn.textContent = '계속하기';
    } else if (state === 'paused') {
      hideOverlay();
      state = 'playing';
      pauseBtn.textContent = '일시정지';
    }
  }
  pauseBtn.addEventListener('click', togglePause);

  levelSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.level-btn');
    if (!btn || btn.disabled) return;
    loadLevel(Number(btn.dataset.level));
  });

  loadLevel(1);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
