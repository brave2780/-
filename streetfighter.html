<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이터즈 아레나 - 대전 격투 게임</title>
<style>
  :root {
    --void: #0a0614;
    --panel: #170f2b;
    --panel-2: #211539;
    --line: #3c2a5e;
    --text: #f3ecff;
    --muted: #a292c9;
    --magenta: #ff2e88;
    --cyan: #2ee6ff;
    --gold: #ffcf4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -10%, #341c52 0%, transparent 55%),
      radial-gradient(circle at 50% 120%, #1a0f2e 0%, var(--void) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cabinet {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 18px 18px 24px;
    background: linear-gradient(180deg, #241638, #150c26);
    border-radius: 18px;
    border: 1px solid var(--line);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 30px 60px rgba(0,0,0,0.6);
  }
  .marquee {
    text-align: center;
    padding: 6px 0 14px;
  }
  .marquee h1 {
    margin: 0;
    font-family: "Arial Black", "Malgun Gothic", sans-serif;
    font-size: 30px;
    letter-spacing: 4px;
    font-weight: 900;
    color: var(--text);
    text-shadow:
      0 0 6px var(--magenta),
      0 0 22px rgba(255,46,136,0.55),
      0 0 40px rgba(46,230,255,0.25);
  }
  .marquee .sub {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--cyan);
    text-transform: uppercase;
    opacity: 0.8;
  }
  .screen-frame {
    position: relative;
    border-radius: 10px;
    padding: 10px;
    background: #060309;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9), inset 0 0 0 2px #000;
  }
  .stage { position: relative; width: 960px; height: 480px; }
  #game { width: 960px; height: 480px; }
  canvas { display: block; border-radius: 4px; }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(8, 5, 16, 0.94);
    border-radius: 4px;
  }
  .screen.hidden { display: none; }
  .pick-row { display: flex; gap: 46px; }
  .pick-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .pick-col h2 {
    margin: 0;
    font-family: "Arial Black", "Malgun Gothic", sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--cyan);
  }
  .char-cards { display: flex; gap: 12px; }
  .char-btn {
    width: 118px;
    padding: 8px;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .char-btn:hover { background: var(--panel-2); transform: translateY(-3px); }
  .char-btn.selected { border-color: var(--gold); background: #2c1d47; box-shadow: 0 0 16px rgba(255,207,77,0.35); }
  .char-btn canvas { display: block; margin: 0 auto 6px; background: radial-gradient(circle at 50% 30%, #241a3a, #0d0818); border-radius: 6px; }
  .cpu-toggle { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  button.action {
    padding: 12px 34px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(90deg, var(--magenta), var(--gold));
    color: #180f2a;
    font-weight: 900;
    font-family: "Arial Black", "Malgun Gothic", sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 0 #7a1548, 0 10px 18px rgba(255,46,136,0.3);
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 3px 0 #7a1548; }
  button.action:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  button.action:hover:not(:disabled) { filter: brightness(1.08); }
  .result-title {
    font-family: "Arial Black", "Malgun Gothic", sans-serif;
    font-size: 34px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(255,207,77,0.6);
  }
  .result-sub { font-size: 15px; color: var(--muted); }
  .controls-note {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
    max-width: 560px;
  }
  .controls-note b { color: var(--text); }
  .controls-note .divider { color: var(--line); margin: 0 10px; }
</style>
</head>
<body>
<div class="cabinet">
  <div class="marquee">
    <h1>FIGHTERS ARENA</h1>
    <div class="sub">Ryu · Ken · Chun-Li</div>
  </div>

  <div class="screen-frame">
    <div class="stage">
      <canvas id="game" width="1920" height="960"></canvas>

      <div class="screen" id="selectScreen">
        <div class="pick-row">
          <div class="pick-col">
            <h2>PLAYER 1</h2>
            <div class="char-cards" id="p1Col"></div>
          </div>
          <div class="pick-col">
            <h2>PLAYER 2</h2>
            <div class="char-cards" id="p2Col"></div>
          </div>
        </div>
        <label class="cpu-toggle"><input type="checkbox" id="cpuToggle"> Player 2를 컴퓨터(CPU)가 조작</label>
        <button class="action" id="startBtn" disabled>대전 시작</button>
        <div class="controls-note">
          <b>P1</b> A/D 이동 · W 점프 · S 방어 · F 펀치 · G 킥
          <span class="divider">|</span>
          <b>P2</b> ←/→ 이동 · ↑ 점프 · ↓ 방어 · K 펀치 · L 킥
        </div>
      </div>

      <div class="screen hidden" id="resultScreen">
        <div class="result-title" id="resultTitle">K.O.</div>
        <div class="result-sub" id="resultSub"></div>
        <button class="action" id="restartBtn">다시 대전</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // The canvas backing buffer is rendered at 2x (1920x960) for crisper, higher
  // pixel-count character art; all gameplay/drawing math below still works in
  // the original 960x480 logical space via this one-time base scale.
  const RENDER_SCALE = 2;
  const W = canvas.width / RENDER_SCALE, H = canvas.height / RENDER_SCALE;
  ctx.scale(RENDER_SCALE, RENDER_SCALE);
  const GROUND_Y = 400;

  const GRAVITY = 2000;
  const JUMP_VELOCITY = 620;
  const MOVE_SPEED = 260;
  const PUNCH_RANGE = 110, PUNCH_DAMAGE = 6, PUNCH_DURATION = 240;
  const KICK_RANGE = 135, KICK_DAMAGE = 12, KICK_DURATION = 430;
  const HIT_STUN = 260;
  const ROUND_TIME = 60;
  const MIN_SEP = 70;
  const SKIN = '#7a4b2c';
  const SKIN_HI = '#96633f';
  const SKIN_LO = '#54331d';

  // ---- All three fighters share the same dark skin tone; outfit/hair/build sets identity ----
  const CHARACTERS = {
    ryu: {
      name: '류',
      outfit: '#f2f2f0', outfitHi: '#ffffff', outfitLo: '#c9c9c6',
      trim: '#8a2020', hair: '#161616', accent: '#e21f1f',
      wrap: '#c81f2a', barefoot: true,
      build: 'gi', headwear: 'headband'
    },
    ken: {
      name: '캔',
      outfit: '#2a3a6e', outfitHi: '#4a5aa0', outfitLo: '#151f45',
      trim: '#dfe4f5', hair: '#e8c547', accent: '#8892c9',
      wrap: 'glove', barefoot: true,
      build: 'gi', headwear: 'swept'
    },
    chunli: {
      name: '춘리',
      outfit: '#2b6fe0', outfitHi: '#4f8fff', outfitLo: '#153a80',
      trim: '#ffd700', hair: '#161616', accent: '#ffd700',
      wrap: 'spiked', barefoot: false,
      build: 'dress', headwear: 'buns'
    }
  };
  const ORDER = ['ryu', 'ken', 'chunli'];
  const PREVIEW_W = 100, PREVIEW_H = 120;

  let picks = { p1: null, p2: null };
  let cpuEnabled = false;
  let players = null;
  let timeLeft = ROUND_TIME;
  let running = false;
  let lastTime = 0;
  let roundOver = false;
  let particles = [];
  let damageNumbers = [];
  let shake = 0;
  let introTimer = 0;
  let clock = 0;

  const keys = new Set();
  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));

  // =========================================================
  // Fighter renderer — joint-based limbs (hip/knee/ankle, shoulder/elbow/fist)
  // so every pose (guard, walk, punch, kick, block, hit) reads as a real stance.
  // =========================================================
  function seg(x1, y1, dx, dy) { return { x1, y1, x2: x1 + dx, y2: y1 + dy }; }

  function drawLimb(g, s, width, colorHi, color, colorLo) {
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len * (width / 2), ny = dx / len * (width / 2);
    const grad = g.createLinearGradient(s.x1 + nx, s.y1 + ny, s.x1 - nx, s.y1 - ny);
    grad.addColorStop(0, colorHi);
    grad.addColorStop(0.55, color);
    grad.addColorStop(1, colorLo);
    g.beginPath();
    g.moveTo(s.x1 + nx, s.y1 + ny);
    g.lineTo(s.x2 + nx, s.y2 + ny);
    g.lineTo(s.x2 - nx, s.y2 - ny);
    g.lineTo(s.x1 - nx, s.y1 - ny);
    g.closePath();
    g.fillStyle = grad;
    g.fill();
    g.beginPath();
    g.arc(s.x1, s.y1, width / 2, 0, Math.PI * 2);
    g.fillStyle = color;
    g.fill();

    // subtle muscle-separation line down bare skin segments (arms/legs)
    if (color === SKIN) {
      const mx = nx * 0.35, my = ny * 0.35;
      g.strokeStyle = 'rgba(0,0,0,0.12)';
      g.lineWidth = Math.max(1, width * 0.08);
      g.beginPath();
      g.moveTo(s.x1 + mx, s.y1 + my);
      g.lineTo(s.x2 + mx, s.y2 + my);
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.1)';
      g.beginPath();
      g.moveTo(s.x1 - mx, s.y1 - my);
      g.lineTo(s.x2 - mx, s.y2 - my);
      g.stroke();
    }
  }

  const IDLE = {
    hip: 0,
    backThigh: [-8, 34], backShin: [-4, 38],
    frontThigh: [18, 32], frontShin: [8, 38],
    backUpperArm: [-6, 20], backForearm: [8, -16],
    frontUpperArm: [8, 18], frontForearm: [16, -14]
  };
  const POSES = {
    idle: IDLE,
    walkA: { ...IDLE, backThigh: [-18, 32], backShin: [-2, 40], frontThigh: [26, 30], frontShin: [4, 40] },
    walkB: { ...IDLE, backThigh: [4, 34], backShin: [-10, 38], frontThigh: [8, 34], frontShin: [16, 38] },
    jump: { ...IDLE, backThigh: [-10, 26], backShin: [-14, 26], frontThigh: [14, 24], frontShin: [16, 26] },
    block: { ...IDLE, hip: 10, backUpperArm: [2, 14], backForearm: [10, -10], frontUpperArm: [10, 8], frontForearm: [16, -2] },
    hit: { ...IDLE, hip: 6, backUpperArm: [-10, 18], backForearm: [-4, -14], frontUpperArm: [-4, 16], frontForearm: [4, -12] },
    punch: { ...IDLE, frontUpperArm: [26, 4], frontForearm: [52, -2] },
    kick: { ...IDLE, frontThigh: [40, -10], frontShin: [46, 12] }
  };

  function poseFor(state, phase, t) {
    if (state === 'walk') return phase < 0 ? POSES.walkA : POSES.walkB;
    if (POSES[state]) return POSES[state];
    return POSES.idle;
  }

  function renderFighter(g, opt) {
    const { x, y, facing, char, state, animT, hp, scale = 1 } = opt;
    const c = char;
    const bob = state === 'idle' ? Math.sin(animT / 340) * 2.4 : 0;
    const walkPhase = Math.sin(animT / 110);
    const poseKey = state === 'walk' ? 'walk' : state;
    const pose = poseFor(poseKey, walkPhase, animT);
    const ko = state === 'ko';

    g.save();
    g.translate(x, y);
    g.scale(facing * scale, scale);
    if (ko) { g.rotate(Math.PI / 2.1); g.translate(0, 6); }
    g.globalAlpha = ko ? 0.55 : 1;

    const hipY = -108 - pose.hip * 0.3 + bob;
    const hip = { x: 0, y: hipY };

    // shadow
    g.beginPath();
    g.ellipse(0, 2, 30, 7, 0, 0, Math.PI * 2);
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.fill();

    // back leg (drawn first = further away)
    const backThigh = seg(hip.x, hip.y, pose.backThigh[0], pose.backThigh[1]);
    drawLimb(g, backThigh, 17, SKIN_HI, SKIN, SKIN_LO);
    const backShin = seg(backThigh.x2, backThigh.y2, pose.backShin[0], pose.backShin[1]);
    drawLimb(g, backShin, 14, c.outfitHi, c.outfit, c.outfitLo);
    drawFoot(g, backShin.x2, backShin.y2, c);

    // back arm
    const backShoulder = { x: -14, y: hipY - 74 };
    const backUpper = seg(backShoulder.x, backShoulder.y, pose.backUpperArm[0], pose.backUpperArm[1]);
    drawLimb(g, backUpper, 14, SKIN_HI, SKIN, SKIN_LO);
    const backFore = seg(backUpper.x2, backUpper.y2, pose.backForearm[0], pose.backForearm[1]);
    drawLimb(g, backFore, 12, SKIN_HI, SKIN, SKIN_LO);
    drawFist(g, backFore.x2, backFore.y2, false, c);

    // torso (tapered quad, gi/dress colored)
    drawTorso(g, hipY, c, pose.hip);

    // head
    drawHead(g, hipY, c);

    // front leg
    const frontThigh = seg(hip.x, hip.y, pose.frontThigh[0], pose.frontThigh[1]);
    drawLimb(g, frontThigh, 18, c.outfitHi, c.outfit, c.outfitLo);
    if (c.build === 'dress') {
      // qipao slit reveals leg skin on the thigh
      drawLimb(g, frontThigh, 12, SKIN_HI, SKIN, SKIN_LO);
    }
    const frontShin = seg(frontThigh.x2, frontThigh.y2, pose.frontShin[0], pose.frontShin[1]);
    drawLimb(g, frontShin, 15, SKIN_HI, SKIN, SKIN_LO);
    drawFoot(g, frontShin.x2, frontShin.y2, c);

    // front arm
    const frontShoulder = { x: 14, y: hipY - 76 };
    const frontUpper = seg(frontShoulder.x, frontShoulder.y, pose.frontUpperArm[0], pose.frontUpperArm[1]);
    drawLimb(g, frontUpper, 15, SKIN_HI, SKIN, SKIN_LO);
    const frontFore = seg(frontUpper.x2, frontUpper.y2, pose.frontForearm[0], pose.frontForearm[1]);
    drawLimb(g, frontFore, 13, SKIN_HI, SKIN, SKIN_LO);
    drawFist(g, frontFore.x2, frontFore.y2, state === 'punch', c);

    // hit flash overlay
    if (state === 'hit') {
      g.globalAlpha = 0.35;
      g.fillStyle = '#ff3b3b';
      g.beginPath();
      g.ellipse(0, hipY - 60, 46, 70, 0, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = ko ? 0.55 : 1;
    }

    g.restore();
  }

  function drawFoot(g, x, y, c) {
    if (c.barefoot) {
      // bare foot: skin-toned sole with a row of small toes
      const grad = g.createLinearGradient(x, y - 4, x, y + 8);
      grad.addColorStop(0, SKIN_HI);
      grad.addColorStop(1, SKIN_LO);
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(x - 7, y);
      g.quadraticCurveTo(x - 8, y + 8, x - 2, y + 8);
      g.lineTo(x + 8, y + 8);
      g.quadraticCurveTo(x + 13, y + 7, x + 12, y + 2);
      g.quadraticCurveTo(x + 10, y - 2, x + 4, y - 1);
      g.closePath();
      g.fill();
      g.fillStyle = SKIN_LO;
      for (let i = 0; i < 4; i++) {
        g.beginPath();
        g.ellipse(x + 9 - i * 2.6, y + 1.5, 1.3, 1.7, 0, 0, Math.PI * 2);
        g.fill();
      }
      g.strokeStyle = 'rgba(0,0,0,0.15)';
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(x - 4, y + 3); g.lineTo(x + 6, y + 3); g.stroke();
      return;
    }

    // ankle cuff: a slim boot collar
    g.fillStyle = '#f4f0e8';
    g.fillRect(x - 6, y - 5, 16, 6);

    g.fillStyle = '#eee9dd';
    g.beginPath();
    g.moveTo(x - 8, y);
    g.lineTo(x + 12, y);
    g.lineTo(x + 12, y + 8);
    g.lineTo(x - 8, y + 8);
    g.closePath();
    g.fill();

    // sole
    g.fillStyle = c.accent;
    g.fillRect(x - 8, y + 7, 20, 2.4);

    // lace/strap detail on the boot
    g.strokeStyle = 'rgba(0,0,0,0.25)';
    g.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(x - 5 + i * 3, y - 4);
      g.lineTo(x - 2 + i * 3, y + 6);
      g.stroke();
    }
  }

  function drawFist(g, x, y, extended, c) {
    const r = extended ? 9 : 8;

    if (c && c.wrap === 'glove') {
      // padded fighting glove instead of a bare fist
      const gr = r + 3;
      const grad = g.createRadialGradient(x - 2, y - 2, 1, x, y, gr);
      grad.addColorStop(0, c.outfitHi);
      grad.addColorStop(1, c.outfitLo);
      g.beginPath();
      g.arc(x, y, gr, 0, Math.PI * 2);
      g.fillStyle = grad;
      g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.25)';
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(x - gr * 0.5, y); g.lineTo(x + gr * 0.5, y); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.4)';
      g.lineWidth = 1.6;
      g.beginPath(); g.arc(x, y, gr, -0.6, 0.5); g.stroke();
      // cuff
      g.fillStyle = c.trim;
      g.beginPath(); g.arc(x, y, gr * 0.55, 0, Math.PI * 2); g.fill();
      return;
    }

    const grad = g.createRadialGradient(x - 2, y - 2, 1, x, y, r);
    grad.addColorStop(0, SKIN_HI);
    grad.addColorStop(1, SKIN_LO);
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fillStyle = grad;
    g.fill();

    // knuckle ridges
    g.strokeStyle = 'rgba(0,0,0,0.3)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x - r * 0.55, y - r * 0.25); g.lineTo(x + r * 0.55, y - r * 0.25); g.stroke();
    g.beginPath(); g.moveTo(x - r * 0.5, y + r * 0.15); g.lineTo(x + r * 0.5, y + r * 0.15); g.stroke();

    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.lineWidth = 2;
    g.beginPath();
    g.arc(x, y, r + 2, -0.4, 0.9);
    g.stroke();

    // wrist accessory
    if (c && c.wrap === 'spiked') {
      // Chun-Li's spiked bracer: a dark cuff ringed with small gold spikes
      g.fillStyle = '#1c1c1c';
      g.beginPath(); g.arc(x, y, r + 4, 0, Math.PI * 2); g.fill();
      g.fillStyle = c.accent;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const bx = x + Math.cos(a) * (r + 4), by = y + Math.sin(a) * (r + 4);
        const tx = x + Math.cos(a) * (r + 8), ty = y + Math.sin(a) * (r + 8);
        const px = x + Math.cos(a + 0.4) * (r + 3), py = y + Math.sin(a + 0.4) * (r + 3);
        g.beginPath(); g.moveTo(bx, by); g.lineTo(tx, ty); g.lineTo(px, py); g.closePath(); g.fill();
      }
    } else if (typeof (c && c.wrap) === 'string') {
      // colored tape wrap (e.g. Ryu's red wrist wraps)
      g.strokeStyle = c.wrap;
      g.lineWidth = 2.4;
      g.beginPath(); g.arc(x, y, r + 2.5, 1.3, 2.6); g.stroke();
      g.beginPath(); g.arc(x, y, r + 4, 1.4, 2.5); g.stroke();
    }
  }

  function drawTorso(g, hipY, c, hipBend) {
    const top = hipY - 84;
    const waistY = hipY - 8;
    const shoulderW = 30, waistW = 20;
    g.save();
    g.translate(0, hipBend * 0.3);
    const grad = g.createLinearGradient(-shoulderW, top, shoulderW, waistY);
    grad.addColorStop(0, c.outfitLo);
    grad.addColorStop(0.5, c.outfit);
    grad.addColorStop(1, c.outfitHi);
    g.beginPath();
    g.moveTo(-shoulderW, top + 6);
    g.quadraticCurveTo(-shoulderW - 4, top + 40, -waistW, waistY);
    g.lineTo(waistW, waistY);
    g.quadraticCurveTo(shoulderW + 4, top + 40, shoulderW, top + 6);
    g.quadraticCurveTo(0, top - 6, -shoulderW, top + 6);
    g.closePath();
    g.fillStyle = grad;
    g.fill();

    if (c.build === 'gi') {
      // open lapel V
      g.fillStyle = SKIN;
      g.beginPath();
      g.moveTo(-8, top + 4);
      g.lineTo(0, top + 34);
      g.lineTo(8, top + 4);

  function drawHead(g, hipY, c) {

    g.arc(0, cy, 15, 0, Math.PI * 2);

    g.lineWidth = 1;
    g.beginPath(); g.arc(-14, cy + 1, 1.6, 0.3, 2.8); g.stroke();

    // jaw / cheek shading for definition

    g.lineWidth = 1.4;
    g.beginPath(); g.arc(0, cy, 13.5, 0.55, 1.35); g.stroke();

    // face features
    g.fillStyle = '#1a1210';
    g.beginPath(); g.ellipse(6, cy - 1, 2.6, 1.8, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(-4, cy - 1, 2.2, 1.6, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#1a1210';
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(2, cy - 6); g.lineTo(10, cy - 7); g.stroke();
    g.beginPath(); g.moveTo(-8, cy - 6); g.lineTo(-1, cy - 6.5); g.stroke();
    g.beginPath(); g.moveTo(2, cy + 8); g.lineTo(9, cy + 7); g.stroke();
    // nose bridge
    g.strokeStyle = 'rgba(0,0,0,0.3)';
    g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(9, cy - 4); g.quadraticCurveTo(12, cy + 1, 9, cy + 3); g.stroke();

    // hair / headwear
    g.fillStyle = c.hair;
    if (c.headwear === 'buns') {
      // bangs sweeping back off the forehead
      g.beginPath(); g.moveTo(-13, cy - 6); g.quadraticCurveTo(0, cy - 18, 13, cy - 6);
      g.quadraticCurveTo(0, cy - 13, -13, cy - 6); g.closePath(); g.fill();
      // ox-horn buns at the sides, with a small ribbon tie where each meets the head
      g.beginPath(); g.arc(-16, cy - 1, 6.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(16, cy - 1, 6.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = c.accent;
      g.fillRect(-19, cy - 3, 6, 3);
      g.fillRect(13, cy - 3, 6, 3);

      g.beginPath(); g.moveTo(-16, cy + 4); g.quadraticCurveTo(-19, cy + 10, -15, cy + 14); g.quadraticCurveTo(-14, cy + 8, -12, cy + 5); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(16, cy + 4); g.quadraticCurveTo(19, cy + 10, 15, cy + 14); g.quadraticCurveTo(14, cy + 8, 12, cy + 5); g.closePath(); g.fill();
    } else if (c.headwear === 'headband') {
      g.beginPath(); g.arc(0, cy - 4, 15.5, Math.PI, 0); g.fill();
      g.fillStyle = c.accent;
      g.fillRect(-15, cy - 8, 30, 6);
      g.beginPath(); g.moveTo(15, cy - 6); g.lineTo(24, cy - 2); g.lineTo(15, cy); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(15, cy + 1); g.lineTo(25, cy + 6); g.lineTo(15, cy + 6); g.closePath(); g.fill();
    } else if (c.headwear === 'swept') {
      // hair swept to one side, with a fringe strand falling toward the face
      g.beginPath();
      g.moveTo(-15, cy - 2);
      g.quadraticCurveTo(-16, cy - 20, 0, cy - 19);
      g.quadraticCurveTo(14, cy - 20, 13, cy - 4);
      g.quadraticCurveTo(9, cy - 9, 5, cy - 7);
      g.quadraticCurveTo(2, cy - 14, -4, cy - 12);
      g.quadraticCurveTo(-10, cy - 14, -15, cy - 2);
      g.closePath();
      g.fill();
      g.beginPath();
      g.moveTo(8, cy - 10);
      g.quadraticCurveTo(13, cy - 3, 10, cy + 3);
      g.quadraticCurveTo(6, cy - 2, 6, cy - 9);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.15)';

    } else {
      g.beginPath();
      g.moveTo(-15, cy - 2);
      g.quadraticCurveTo(-16, cy - 20, 0, cy - 18);
      g.quadraticCurveTo(16, cy - 20, 15, cy - 2);
      g.quadraticCurveTo(10, cy - 14, 4, cy - 12);
      g.quadraticCurveTo(0, cy - 16, -4, cy - 12);
      g.quadraticCurveTo(-10, cy - 14, -15, cy - 2);
      g.closePath();
      g.fill();
    }
    g.restore();
  }

  // ---- Combat ----
  function spawnHitFx(x, y, blocked) {
    const n = blocked ? 5 : 10;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 160;
      particles.push({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 40,
        life: 260 + Math.random() * 160, maxLife: 400,
        color: blocked ? '#9fd8ff' : (Math.random() < 0.5 ? '#ffe95e' : '#ff5e5e')
      });
    }
    if (!blocked) shake = 10;
  }

  function spawnDamageNumber(x, y, amount, blocked) {
    damageNumbers.push({
      x, y, vy: -60, life: 850, maxLife: 850,
      text: '-' + amount,
      color: blocked ? '#9fd8ff' : '#ff5e5e'
    });
  }

  function tryAttack(attacker, defender, type) {
    if (attacker.cooldown > 0 || attacker.hitTimer > 0 || attacker.state === 'ko') return;
    const duration = type === 'punch' ? PUNCH_DURATION : KICK_DURATION;
    const range = type === 'punch' ? PUNCH_RANGE : KICK_RANGE;
    const damage = (type === 'punch' ? PUNCH_DAMAGE : KICK_DAMAGE) * attacker.damageMult;
    attacker.state = type;
    attacker.lockTimer = duration;
    attacker.cooldown = duration;

    const dist = Math.abs(attacker.x - defender.x);
    if (dist <= range && defender.state !== 'ko') {
      const hitX = (attacker.x + defender.x) / 2;
      const hitY = GROUND_Y - 90;
      const numberX = defender.x;
      const numberY = GROUND_Y - defender.y - 190;
      const prevHp = defender.hp;
      if (defender.state === 'block') {
        defender.hp = Math.max(0, defender.hp - 1);
        spawnHitFx(hitX, hitY, true);
        spawnDamageNumber(numberX, numberY, prevHp - defender.hp, true);
      } else {
        defender.hp = Math.max(0, defender.hp - damage);
        defender.state = 'hit';
        defender.hitTimer = HIT_STUN;
        defender.x += (defender.x > attacker.x ? 1 : -1) * 10;
        spawnHitFx(hitX, hitY, false);
        spawnDamageNumber(numberX, numberY, prevHp - defender.hp, false);
      }
      if (defender.hp <= 0) {
        defender.state = 'ko';
        endRound(attacker === players.p1 ? 'p1' : 'p2');
      }
    }
  }

  function updatePlayer(p, dt, input) {
    p.animT += dt;
    if (p.state === 'ko') return;

    if (p.hitTimer > 0) {
      p.hitTimer -= dt;
      if (p.hitTimer <= 0) { p.hitTimer = 0; p.state = 'idle'; }
    }
    if (p.cooldown > 0) p.cooldown -= dt;
    if (p.lockTimer > 0) {
      p.lockTimer -= dt;
      if (p.lockTimer <= 0 && (p.state === 'punch' || p.state === 'kick')) p.state = 'idle';
    }

    const locked = p.hitTimer > 0 || p.state === 'punch' || p.state === 'kick';

    if (!locked) {
      if (input.block) {
        p.state = 'block';
      } else if (input.left || input.right) {
        const dir = input.left ? -1 : 1;
        p.x += dir * MOVE_SPEED * (dt / 1000);
        p.state = p.y > 0 ? 'jump' : 'walk';
      } else {
        p.state = p.y > 0 ? 'jump' : 'idle';
      }
      if (input.jump && p.jumpsUsed < 2) { p.vy = JUMP_VELOCITY; p.jumpsUsed++; p.state = 'jump'; }
      if (input.punch) tryAttack(p, p.other, 'punch');
      else if (input.kick) tryAttack(p, p.other, 'kick');
    }

    if (p.y !== 0 || p.vy !== 0) {
      p.vy -= GRAVITY * (dt / 1000);
      p.y += p.vy * (dt / 1000);
      if (p.y < 0) { p.y = 0; p.vy = 0; p.jumpsUsed = 0; if (p.state === 'jump') p.state = 'idle'; }
    }

    p.x = Math.max(60, Math.min(W - 60, p.x));
  }

  function resolveSeparation(a, b) {
    const dist = b.x - a.x;
    if (Math.abs(dist) < MIN_SEP) {
      const push = (MIN_SEP - Math.abs(dist)) / 2;
      const dir = dist >= 0 ? 1 : -1;
      a.x -= dir * push;
      b.x += dir * push;
    }
  }

  // Jump is edge-triggered (fresh key-down only) so holding the key can't
  // auto-spend the second jump the instant the first one leaves the ground.
  let p1JumpHeld = false, p2JumpHeld = false, cpuJumpHeld = false;

  function readInput(prefix) {
    if (prefix === 'p1') {
      const jumpNow = keys.has('KeyW');
      const jump = jumpNow && !p1JumpHeld;
      p1JumpHeld = jumpNow;
      return {
        left: keys.has('KeyA'), right: keys.has('KeyD'),
        jump, block: keys.has('KeyS'),
        punch: keys.has('KeyF'), kick: keys.has('KeyG')
      };
    }
    const jumpNow = keys.has('ArrowUp');
    const jump = jumpNow && !p2JumpHeld;
    p2JumpHeld = jumpNow;
    return {
      left: keys.has('ArrowLeft'), right: keys.has('ArrowRight'),
      jump, block: keys.has('ArrowDown'),
      punch: keys.has('KeyK'), kick: keys.has('KeyL')
    };
  }

  let cpuState = { nextDecision: 0, action: null };
  function cpuInput(p, opponent, dt) {
    cpuState.nextDecision -= dt;
    if (cpuState.nextDecision <= 0) {
      const dist = Math.abs(p.x - opponent.x);
      cpuState.nextDecision = 150 + Math.random() * 200;
      if (dist > KICK_RANGE + 20) {
        cpuState.action = p.x < opponent.x ? 'right' : 'left';
      } else if (dist > PUNCH_RANGE) {
        cpuState.action = Math.random() < 0.5 ? (p.x < opponent.x ? 'right' : 'left') : 'kick';
      } else {
        const roll = Math.random();
        cpuState.action = roll < 0.35 ? 'punch' : roll < 0.6 ? 'kick' : roll < 0.8 ? 'block' : 'jump';
      }
    }
    const jumpNow = cpuState.action === 'jump';
    const jump = jumpNow && !cpuJumpHeld;
    cpuJumpHeld = jumpNow;
    return {
      left: cpuState.action === 'left', right: cpuState.action === 'right',
      jump, block: cpuState.action === 'block',
      punch: cpuState.action === 'punch', kick: cpuState.action === 'kick'
    };
  }

  function endRound(winnerKey) {
    roundOver = true;
    running = false;
    showResult(`${players[winnerKey].name} 승리!`, 'K.O.');
  }

  function showResult(sub, title) {
    document.getElementById('resultTitle').textContent = title;

  // ---- Background ----
  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2a1350');
    g.addColorStop(0.5, '#5c2a5e');
    g.addColorStop(0.8, '#c95a4a');
    g.addColorStop(1, '#ffb35a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun
    const sunG = ctx.createRadialGradient(W / 2, 210, 10, W / 2, 210, 90);
    sunG.addColorStop(0, 'rgba(255,220,150,0.9)');
    sunG.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = sunG;
    ctx.beginPath(); ctx.arc(W / 2, 210, 90, 0, Math.PI * 2); ctx.fill();

    // distant mountains
    ctx.fillStyle = 'rgba(30,14,40,0.7)';
    ctx.beginPath();
    ctx.moveTo(0, 300);
    for (let x = 0; x <= W; x += 80) ctx.lineTo(x, 300 - Math.sin(x * 0.01 + 2) * 30 - 20);
    ctx.lineTo(W, GROUND_Y); ctx.lineTo(0, GROUND_Y); ctx.closePath();
    ctx.fill();

    // pillars
    ctx.fillStyle = 'rgba(15,8,24,0.55)';
    for (let i = 0; i < 5; i++) {
      const px = 40 + i * 220;
      ctx.fillRect(px, 60, 26, GROUND_Y - 60);
      ctx.beginPath(); ctx.arc(px + 13, 60, 20, Math.PI, 0); ctx.fill();
    }

    // floor with perspective tiles
    ctx.fillStyle = '#160d24';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    const vanishX = W / 2;
    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.moveTo(vanishX + i * 40, GROUND_Y);
      ctx.lineTo(vanishX + i * 220, H);
      ctx.stroke();
    }
    for (let j = 0; j < 5; j++) {
      const yy = GROUND_Y + j * j * 3 + j * 10;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, GROUND_Y, W, 6);
  }

  function drawParticles(dt) {
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * (dt / 1000);
      p.y += p.vy * (dt / 1000);
      p.vy += 900 * (dt / 1000);
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawDamageNumbers(dt) {
    damageNumbers = damageNumbers.filter(d => d.life > 0);
    for (const d of damageNumbers) {
      d.life -= dt;
      d.y += d.vy * (dt / 1000);
      d.vy += 60 * (dt / 1000);
      const alpha = Math.max(0, d.life / d.maxLife);
      ctx.globalAlpha = alpha;
      ctx.font = '900 24px "Arial Black", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.strokeText(d.text, d.x, d.y);
      ctx.fillStyle = d.color;
      ctx.fillText(d.text, d.x, d.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    drawBar(24, 22, players.p1, false);
    drawBar(W - 264, 22, players.p2, true);

    ctx.fillStyle = '#f2eefb';
    ctx.font = 'bold 14px "Arial Black", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(players.p1.name.toUpperCase(), 24, 58);
    ctx.textAlign = 'right';
    ctx.fillText(players.p2.name.toUpperCase(), W - 24, 58);

    ctx.textAlign = 'center';
    ctx.font = 'bold 26px "Arial Black", sans-serif';
    ctx.fillStyle = '#ffe95e';
    ctx.shadowColor = 'rgba(255,207,77,0.6)';
    ctx.shadowBlur = 12;
    ctx.fillText(Math.ceil(timeLeft), W / 2, 44);
    ctx.shadowBlur = 0;

    if (introTimer > 0) {
      const p = Math.min(1, introTimer / 1100);
      ctx.globalAlpha = Math.min(1, (1 - p) * 4);
      ctx.font = '900 54px "Arial Black", sans-serif';
      ctx.fillStyle = '#ff2e88';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,46,136,0.8)';
      ctx.shadowBlur = 20;
      ctx.fillText(introTimer > 500 ? 'READY' : 'FIGHT!', W / 2, H / 2);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  function drawBar(x, y, p, flip) {
    const width = 240, height = 18;
    ctx.fillStyle = '#1c1130';
    ctx.fillRect(x - 2, y - 2, width + 4, height + 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, width, height);
    const pct = Math.max(0, p.hp) / 100;
    const barGrad = ctx.createLinearGradient(x, y, x, y + height);
    if (pct > 0.5) { barGrad.addColorStop(0, '#8dffa0'); barGrad.addColorStop(1, '#2fb84e'); }
    else if (pct > 0.2) { barGrad.addColorStop(0, '#ffe08a'); barGrad.addColorStop(1, '#e0a020'); }
    else { barGrad.addColorStop(0, '#ff8a8a'); barGrad.addColorStop(1, '#c92020'); }
    ctx.fillStyle = barGrad;
    if (flip) ctx.fillRect(x + width * (1 - pct), y, width * pct, height);
    else ctx.fillRect(x, y, width * pct, height);
    ctx.strokeStyle = '#4a3b6b';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, height);
  }

  // ---- Main loop (single perpetual RAF chain; branches on `running`) ----
  function loop(time) {
    requestAnimationFrame(loop);

    if (!lastTime) lastTime = time;
    const dt = Math.min(50, time - lastTime);
    lastTime = time;

    if (!running) { drawPreviews(time); return; }

    clock += dt;
    if (introTimer > 0) introTimer -= dt;

    if (!roundOver) {
      if (introTimer <= 0) {
        timeLeft -= dt / 1000;
        if (timeLeft <= 0) {
          timeLeft = 0;
          const winnerKey = players.p1.hp === players.p2.hp ? null : (players.p1.hp > players.p2.hp ? 'p1' : 'p2');
          roundOver = true; running = false;
          showResult('시간 종료', winnerKey ? `${players[winnerKey].name} 승리!` : '무승부');
        } else {
          players.p1.other = players.p2;
          players.p2.other = players.p1;
          const input1 = readInput('p1');
          const input2 = cpuEnabled ? cpuInput(players.p2, players.p1, dt) : readInput('p2');
          updatePlayer(players.p1, dt, input1);
          updatePlayer(players.p2, dt, input2);
          resolveSeparation(players.p1, players.p2);
          players.p1.facing = players.p2.x >= players.p1.x ? 1 : -1;
          players.p2.facing = players.p1.x >= players.p2.x ? 1 : -1;
        }
      } else {
        players.p1.animT += dt;
        players.p2.animT += dt;
      }
    }

    ctx.save();
    if (shake > 0) {
      shake = Math.max(0, shake - dt * 0.05);
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBackground(clock);
    renderFighter(ctx, { x: players.p1.x, y: GROUND_Y - players.p1.y, facing: players.p1.facing, char: players.p1.char, state: players.p1.state, animT: players.p1.animT, hp: players.p1.hp });
    renderFighter(ctx, { x: players.p2.x, y: GROUND_Y - players.p2.y, facing: players.p2.facing, char: players.p2.char, state: players.p2.state, animT: players.p2.animT, hp: players.p2.hp });
    drawParticles(dt);
    drawDamageNumbers(dt);
    ctx.restore();
    drawHUD();
  }

  drawBackground(0);
  requestAnimationFrame(loop);
})();
</script>
