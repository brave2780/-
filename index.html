<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레인보우 테트리스</title>
<style>
  :root {
    --bg: #0f0f1a;
    --panel: #1b1b2c;
    --border: #35355a;
    --text: #eaeaf5;
    --accent: #8a8aff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1a2e, #0a0a14 70%);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, red, orange, yellow, limegreen, dodgerblue, indigo, violet);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 3px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 30px rgba(120, 100, 255, 0.15);
  }
  canvas {
    display: block;
    background: #08080f;
    border-radius: 4px;
  }
  .side {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 13px;
    margin: 0 0 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .stat-row span:last-child {
    font-weight: bold;
    color: #fff;
  }
  #nextCanvas {
    background: #08080f;
    border-radius: 4px;
    display: block;
    margin: 0 auto;
  }
  .level-select {
    display: flex;
    gap: 6px;
  }
  .level-btn {
    flex: 1;
    padding: 8px 0;
    background: #26264a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.15s, transform 0.1s;
  }
  .level-btn:hover { background: #35356a; }
  .level-btn.active {
    background: linear-gradient(90deg, #ff3b3b, #ffb03b, #f6ff3b, #3bff5e, #3bb6ff, #7c3bff);
    color: #000;
    border-color: transparent;
  }
  .controls-list {
    font-size: 12.5px;
    line-height: 1.9;
    color: #c8c8e0;
  }
  .controls-list b { color: #fff; }
  button.action {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #10101c;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  button.action:hover { filter: brightness(1.1); }
  .overlay {
    position: absolute;
    inset: 10px;
    background: rgba(5, 5, 12, 0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    text-align: center;
    gap: 10px;
  }
  .overlay.show { display: flex; }
  .overlay .title {
    font-size: 26px;
    font-weight: bold;
    background: linear-gradient(90deg, red, orange, yellow, limegreen, dodgerblue, indigo, violet);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay .sub { font-size: 14px; color: #ccc; }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>RAINBOW TETRIS</h1>
    <div class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="title" id="overlayTitle">GAME OVER</div>
        <div class="sub" id="overlaySub">점수: 0</div>
        <button class="action" id="restartBtn" style="width:140px;">다시 시작</button>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>Status</h2>
      <div class="stat-row"><span>점수</span><span id="score">0</span></div>
      <div class="stat-row"><span>줄 삭제</span><span id="lines">0</span></div>
      <div class="stat-row"><span>레벨</span><span id="levelLabel">1</span></div>
    </div>

    <div class="panel">
      <h2>다음 블록</h2>
      <canvas id="nextCanvas" width="120" height="120"></canvas>
    </div>

    <div class="panel">
      <h2>레벨 선택 (속도)</h2>
      <div class="level-select" id="levelSelect">
        <button class="level-btn active" data-level="1">1</button>
        <button class="level-btn" data-level="2">2</button>
        <button class="level-btn" data-level="3">3</button>
        <button class="level-btn" data-level="4">4</button>
        <button class="level-btn" data-level="5">5</button>
      </div>
    </div>

    <div class="panel">
      <h2>조작법</h2>
      <div class="controls-list">
        <b>← →</b> 이동<br>
        <b>↑</b> 회전<br>
        <b>↓</b> 소프트 드롭<br>
        <b>Space</b> 하드 드롭<br>
        <b>P</b> 일시정지
      </div>
      <button class="action" id="pauseBtn">일시정지</button>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;

  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nctx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelLabelEl = document.getElementById('levelLabel');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const restartBtn = document.getElementById('restartBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const levelSelect = document.getElementById('levelSelect');

  // Standard 7 tetromino shapes (SRS-style rotation states), rainbow-colored.
  const SHAPES = {
    I: { color: '#FF0000', cells: [ [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]], [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]] ] },
    O: { color: '#FF9900', cells: [ [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]] ] },
    T: { color: '#FFEE00', cells: [ [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]] ] },
    S: { color: '#33CC33', cells: [ [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]], [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]] ] },
    Z: { color: '#3399FF', cells: [ [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]] ] },
    J: { color: '#4B0082', cells: [ [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]] ] },
    L: { color: '#9400D3', cells: [ [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ] }
  };
  const TYPES = Object.keys(SHAPES);

  // Classic Tetris Guideline drop-speed formula:
  // seconds per row = (0.8 - (level * 0.007)) ^ level, using level index 0..4 for our 5 stages.
  function levelDropMs(level) {
    const idx = level - 1; // 0-based guideline level
    const seconds = Math.pow(0.8 - (idx * 0.007), idx);
    return Math.round(seconds * 1000);
  }
  const LEVEL_SPEEDS = [1, 2, 3, 4, 5].map(levelDropMs); // ms per row drop per level

  let grid, current, next, score, linesCleared, level, dropTimer, dropInterval, paused, gameOver, lastTime;

  function newGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function randomType() {
    return TYPES[Math.floor(Math.random() * TYPES.length)];
  }

  function spawnPiece(type) {
    return {
      type,
      rotation: 0,
      x: 3,
      y: -2,
      color: SHAPES[type].color
    };
  }

  function pieceCells(piece) {
    return SHAPES[piece.type].cells[piece.rotation].map(([cx, cy]) => [piece.x + cx, piece.y + cy]);
  }

  function collides(piece, dx, dy, rotation) {
    const rot = rotation !== undefined ? rotation : piece.rotation;
    const cells = SHAPES[piece.type].cells[rot];
    for (const [cx, cy] of cells) {
      const x = piece.x + cx + dx;
      const y = piece.y + cy + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    for (const [x, y] of pieceCells(current)) {
      if (y < 0) {
        triggerGameOver();
        return;
      }
      grid[y][x] = current.color;
    }
    clearLines();
    current = next;
    next = spawnPiece(randomType());
    if (collides(current, 0, 0)) {
      triggerGameOver();
    }
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] || 800;
      score += points * level;
      linesCleared += cleared;
      scoreEl.textContent = score;
      linesEl.textContent = linesCleared;
    }
  }

  function triggerGameOver() {
    gameOver = true;
    overlayTitle.textContent = 'GAME OVER';
    overlaySub.textContent = `점수: ${score} / 줄: ${linesCleared}`;
    overlay.classList.add('show');
  }

  function move(dx, dy) {
    if (gameOver || paused) return;
    if (!collides(current, dx, dy)) {
      current.x += dx;
      current.y += dy;
      return true;
    } else if (dy > 0) {
      lockPiece();
    }
    return false;
  }

  function rotate() {
    if (gameOver || paused) return;
    const newRotation = (current.rotation + 1) % 4;
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(current, k, 0, newRotation)) {
        current.x += k;
        current.rotation = newRotation;
        return;
      }
    }
  }

  function hardDrop() {
    if (gameOver || paused) return;
    let dist = 0;
    while (!collides(current, 0, 1)) {
      current.y += 1;
      dist++;
    }
    score += dist * 2;
    scoreEl.textContent = score;
    lockPiece();
  }

  function drawCell(context, x, y, color, size) {
    context.fillStyle = color;
    context.fillRect(x * size, y * size, size - 1, size - 1);
    context.strokeStyle = 'rgba(255,255,255,0.25)';
    context.strokeRect(x * size + 0.5, y * size + 0.5, size - 2, size - 2);
  }

  function draw() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    // grid background lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(COLS * CELL, y * CELL);
      ctx.stroke();
    }

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x], CELL);
      }
    }

    for (const [x, y] of pieceCells(current)) {
      if (y >= 0) drawCell(ctx, x, y, current.color, CELL);
    }

    // next piece preview
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const nCells = SHAPES[next.type].cells[0];
    const size = 24;
    const offsetX = (nextCanvas.width - 4 * size) / 2;
    const offsetY = (nextCanvas.height - 4 * size) / 2;
    for (const [cx, cy] of nCells) {
      nctx.fillStyle = next.color;
      nctx.fillRect(offsetX + cx * size, offsetY + cy * size, size - 1, size - 1);
    }
  }

  function loop(time) {
    if (!lastTime) lastTime = time;
    const delta = time - lastTime;
    lastTime = time;

    if (!gameOver && !paused) {
      dropTimer += delta;
      if (dropTimer >= dropInterval) {
        dropTimer = 0;
        move(0, 1);
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  function setLevel(lv) {
    level = lv;
    dropInterval = LEVEL_SPEEDS[lv - 1];
    levelLabelEl.textContent = lv;
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.level) === lv);
    });
  }

  function resetGame() {
    grid = newGrid();
    current = spawnPiece(randomType());
    next = spawnPiece(randomType());
    score = 0;
    linesCleared = 0;
    dropTimer = 0;
    paused = false;
    gameOver = false;
    lastTime = 0;
    scoreEl.textContent = score;
    linesEl.textContent = linesCleared;
    overlay.classList.remove('show');
    pauseBtn.textContent = '일시정지';
  }

  document.addEventListener('keydown', (e) => {
    if (gameOver) return;
    switch (e.code) {
      case 'ArrowLeft': e.preventDefault(); move(-1, 0); break;
      case 'ArrowRight': e.preventDefault(); move(1, 0); break;
      case 'ArrowDown': e.preventDefault(); move(0, 1); break;
      case 'ArrowUp': e.preventDefault(); rotate(); break;
      case 'Space': e.preventDefault(); hardDrop(); break;
      case 'KeyP': e.preventDefault(); togglePause(); break;
    }
  });

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '계속하기' : '일시정지';
  }

  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', () => {
    resetGame();
  });

  levelSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.level-btn');
    if (!btn) return;
    setLevel(Number(btn.dataset.level));
  });

  resetGame();
  setLevel(1);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
